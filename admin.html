<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<h1>BookNest Admin Panel</h1>

<section id="login-section">
    <h2>Admin Login</h2>
    <form id="admin-login-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p id="login-message"></p>
    </form>
</section>

<section id="dashboard" hidden>

    <h2>Sales Dashboard</h2>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Books Added</h3>
            <p id="total-books">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Books Sold</h3>
            <p id="total-sold">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Money Earned</h3>
            <p id="total-revenue">₹0</p>
        </div>

        <div class="stat-card">
            <h3>Total Orders</h3>
            <p id="total-orders">0</p>
        </div>
    </div>

    <h2>Add New Book</h2>

    <form id="add-book-form">
        <input type="text" id="book-title" placeholder="Book Title" required>
        <input type="text" id="book-author" placeholder="Author" required>
        <input type="number" id="book-price" placeholder="Price" min="1" required>
        <button type="submit">Add Book</button>
    </form>

    <h2>Book List</h2>
    <ul id="book-list"></ul>

    <h2>Sales History</h2>
    <p id="sales-message">No sales recorded yet.</p>
    <ul id="sales-list"></ul>

    <button id="logout-button" type="button">Logout</button>

</section>

<script src="admin.js"></script>

</body>
</html>
