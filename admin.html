<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest Admin Panel</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <h1>📚 BookNest Admin Panel</h1>

    <div id="login-section">
        <h2>Admin Login</h2>

        <form id="admin-login-form">
            <input
                type="text"
                id="admin-username"
                placeholder="Enter username"
                required
            >

            <input
                type="password"
                id="admin-password"
                placeholder="Enter password"
                required
            >

            <button type="submit">Login</button>
        </form>
    </div>

    <div id="admin-panel" style="display:none;">

        <h2>Sales Dashboard</h2>

        <div id="sales-summary">
            <h3>Total Orders: <span id="total-orders">0</span></h3>

            <h3>Total Books Sold:
                <span id="total-books-sold">0</span>
            </h3>

            <h3>Total Sales Revenue:
                <span id="total-revenue">₹0</span>
            </h3>
        </div>

        <h2>Customer Orders</h2>

        <div id="order-list">
            <p>No orders yet.</p>
        </div>

        <button onclick="logoutAdmin()">Logout</button>

    </div>

    <script>
        function logoutAdmin() {
            sessionStorage.removeItem("booknestAdminLoggedIn");
            location.reload();
        }
    </script>

    <script src="admin.js"></script>

</body>
</html>
