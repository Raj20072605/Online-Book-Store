<script>
document.addEventListener("DOMContentLoaded", function () {

    const cart = JSON.parse(
        localStorage.getItem("booknestCart") || "[]"
    );

    const itemsBox = document.getElementById("orderItems");
    const totalBox = document.getElementById("totalAmount");
    const form = document.getElementById("deliveryForm");
    const message = document.getElementById("message");
    const submitButton = form.querySelector('button[type="submit"]');

    let total = 0;

    function showCart() {
        itemsBox.innerHTML = "";
        total = 0;

        if (cart.length === 0) {
            itemsBox.textContent =
                "Your cart is empty. Return to the shop and add books.";
            submitButton.disabled = true;
            return;
        }

        cart.forEach(function (book) {
            const quantity = Number(book.quantity || 1);
            const price = Number(book.price || 0);
            const subtotal = quantity * price;

            total += subtotal;

            const row = document.createElement("div");
            row.className = "order-item";
            row.textContent =
                book.name + " × " + quantity + " — ₹" + subtotal;

            itemsBox.appendChild(row);
        });

        totalBox.textContent = total.toLocaleString("en-IN");
    }

    showCart();

    const savedName =
        localStorage.getItem("booknestUsername") ||
        sessionStorage.getItem("booknestUsername") ||
        "";

    document.getElementById("customerName").value = savedName;

    form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
        }

        const selectedPayment = document.querySelector(
            'input[name="paymentMethod"]:checked'
        );

        if (!selectedPayment) {
            alert("Please select a payment method.");
            return;
        }

        const customer = {
            name: document.getElementById("customerName").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            house: document.getElementById("house").value.trim(),
            street: document.getElementById("street").value.trim(),
            city: document.getElementById("city").value.trim(),
            state: document.getElementById("state").value.trim(),
            pincode: document.getElementById("pincode").value.trim()
        };

        const order = {
            orderId: "BN" + Date.now(),
            customerName: customer.name,
            phone: customer.phone,
            address: customer.house + ", " +
                     customer.street + ", " +
                     customer.city + ", " +
                     customer.state + " - " +
                     customer.pincode,
            date: new Date().toLocaleString("en-IN"),
            books: cart.map(function (book) {
                return {
                    name: book.name,
                    price: Number(book.price || 0),
                    quantity: Number(book.quantity || 1)
                };
            }),
            total: total,
            paymentMethod: selectedPayment.value,
            status: "Order Placed"
        };

        try {
            const orders = JSON.parse(
                localStorage.getItem("booknestOrders") || "[]"
            );

            if (!Array.isArray(orders)) {
                throw new Error("Saved order history is invalid.");
            }

            orders.push(order);

            localStorage.setItem(
                "booknestOrders",
                JSON.stringify(orders)
            );

            const savedOrders = JSON.parse(
                localStorage.getItem("booknestOrders") || "[]"
            );

            const orderSaved = savedOrders.some(function (savedOrder) {
                return savedOrder.orderId === order.orderId;
            });

            if (!orderSaved) {
                throw new Error("Order verification failed.");
            }

            localStorage.removeItem("booknestCart");

            message.style.color = "green";
            message.textContent =
                "Order placed successfully! Order ID: " + order.orderId;

            form.reset();
            document.getElementById("customerName").value = customer.name;
            submitButton.disabled = true;

            console.log("BookNest order saved:", order);
            console.log("All saved orders:", savedOrders);

        } catch (error) {
            console.error("BookNest order save failed:", error);

            message.style.color = "red";
            message.textContent =
                "Order could not be saved. Please check the browser Console.";
        }
    });
});
</script>
